server.port=9090

spring.ai.dashscope.api-key=${ALIYUN_API_KEY:}
spring.ai.dashscope.chat.options.model=qwen3.8-flash
spring.ai.dashscope.chat.options.multi-model=true

logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=debug

spring.datasource.url=jdbc:mysql://localhost:3306/ai_career_helper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# mybatis-plus的配置
# 实体类的配置
mybatis-plus.type-aliases-package=cn.edu.gdc.zy.ai_career_helper.entity
# xml的文件
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
# 是否启用下划线转驼峰，如ticket_name会转换成ticketName
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 使用标准的日志输出
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 主键生成方式，我们使用是自动生成主键
mybatis-plus.global-config.db-config.id-type=auto
# 是否显示mybaits-plus的banner，这里不显示
mybatis-plus.global-config.banner=false


spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.schema=classpath:files/init-chat.sql