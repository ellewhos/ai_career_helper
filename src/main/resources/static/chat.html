<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能求职助手</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f5f5f5;height:100vh;display:flex;flex-direction:column}
        .header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:15px 20px;text-align:center;font-size:18px;font-weight:600;position:relative}
        .user-info{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:12px;font-size:14px}
        .logout-btn{border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.1);color:#fff;padding:6px 12px;border-radius:18px;cursor:pointer;font-size:13px}
        .logout-btn:hover{background:rgba(255,255,255,.2)}
        .chat-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px}
        .message{max-width:85%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.7;word-break:break-word}
        .message.user{align-self:flex-end;background:#667eea;color:#fff;border-bottom-right-radius:4px}
        .message.ai{align-self:flex-start;background:#fff;color:#333;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1);max-width:90%}
        .message.ai p{margin-bottom:10px}.message.ai p:last-child{margin-bottom:0}
        .message.ai h1,.message.ai h2,.message.ai h3{margin:10px 0;color:#333}.message.ai h3{font-size:16px}
        .message.ai ul,.message.ai ol{margin:0 0 10px 20px}.message.ai li{margin-bottom:5px}.message.ai strong{color:#5b4bc4}
        .message.ai table{width:100%;border-collapse:collapse;margin:12px 0;background:#fff;font-size:13px}
        .message.ai th{background:#667eea;color:#fff;font-weight:600;padding:10px 12px;border:1px solid #ddd;text-align:left;white-space:nowrap}
        .message.ai td{padding:9px 12px;border:1px solid #ddd;color:#333;background:#fff}
        .message.ai tr:nth-child(even) td{background:#f8f8ff}.message.ai tr:hover td{background:#f0efff}
        .table-wrapper{overflow-x:auto;width:100%;margin:10px 0}
        .message.ai code{background:#f1f1f1;padding:2px 5px;border-radius:4px;font-family:monospace;color:#d63384}
        .message.ai pre{background:#272822;color:#f8f8f2;padding:12px;border-radius:8px;overflow-x:auto;margin:10px 0}
        .message.ai pre code{background:none;color:inherit;padding:0}
        .input-area{background:#fff;padding:15px 20px;display:flex;gap:10px;border-top:1px solid #eee}
        .input-area input{flex:1;padding:12px 16px;border:1px solid #ddd;border-radius:25px;font-size:14px;outline:none;transition:border-color .3s}
        .input-area input:focus{border-color:#667eea}
        .input-area button{padding:12px 24px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:0;border-radius:25px;font-size:14px;cursor:pointer;transition:opacity .3s}
        .input-area button:hover{opacity:.9}.input-area button:disabled{opacity:.5;cursor:not-allowed}
        @media(max-width:700px){
            .message{max-width:92%}.message.ai{max-width:96%}.user-info{right:10px}.user-info span{display:none}
            .input-area{padding:10px}.input-area button{padding:10px 18px}
        }
    </style>
</head>
<body>
<div class="header">🤖 AI 智能求职助手<div class="user-info"><span id="userInfo">用户</span><button class="logout-btn" onclick="logout()">退出登录</button></div></div>

<div class="chat-container" id="chatContainer">
    <div class="message ai">你好！我是 AI 智能求职助手，有什么可以帮你的吗？</div>
</div>

<div class="input-area">
    <input type="text" id="messageInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">发送</button>
</div>

<script>
    window.onload=()=>{
        const id=localStorage.getItem('id');
        if(!id){
            alert('请先登录');
            location.href='login.html';
            return;
        }
        document.getElementById('userInfo').textContent='用户 #'+id;
    };

    async function sendMessage(){
        const input=document.getElementById('messageInput');
        const btn=document.getElementById('sendBtn');
        const container=document.getElementById('chatContainer');
        const message=input.value.trim();
        if(!message)return;

        const id=localStorage.getItem('id');
        if(!id){
            alert('登录信息已失效，请重新登录');
            location.href='login.html';
            return;
        }

        appendMessage(message,'user');
        input.value='';
        btn.disabled=true;

        const aiMessageDiv=document.createElement('div');
        aiMessageDiv.className='message ai';
        aiMessageDiv.innerHTML='正在思考...';
        container.appendChild(aiMessageDiv);
        container.scrollTop=container.scrollHeight;

        try{
            const response=await fetch(`http://localhost:9090/agent/chat?id=${encodeURIComponent(id)}`,{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({message})
            });

            if(!response.ok)throw new Error('HTTP错误：'+response.status);
            if(!response.body)throw new Error('ReadableStream not supported');

            const reader=response.body.getReader();
            const decoder=new TextDecoder('utf-8');
            let aiResponseText='';

            while(true){
                const {done,value}=await reader.read();
                if(done)break;

                aiResponseText+=decoder.decode(value,{stream:true});
                aiMessageDiv.innerHTML=DOMPurify.sanitize(marked.parse(aiResponseText));
                container.scrollTop=container.scrollHeight;
            }
        }catch(error){
            console.error('Error:',error);
            aiMessageDiv.textContent='抱歉，服务暂时不可用，请稍后再试。';
        }

        btn.disabled=false;
        input.focus();
    }

    function appendMessage(text,type){
        const container=document.getElementById('chatContainer');
        const div=document.createElement('div');
        div.className='message '+type;
        div.textContent=text;
        container.appendChild(div);
        container.scrollTop=container.scrollHeight;
    }

    function logout(){
        localStorage.removeItem('id');
        location.href='login.html';
    }
</script>
</body>
</html>
